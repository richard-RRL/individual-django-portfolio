{% extends "portfolio_app/base_template.html" %}

{% block content %}

<h2>{{ student.name }}</h2>

<p>Email: {{ student.email }}</p>
<p>Major: {{ student.get_major_display }}</p>

<p>Portfolio: </p>
<a href= "{% url 'portfolio-detail' student.portfolio.student.pk %}">
    <li>{{ student.portfolio.title }}</li>
</a>


<a href="{% url 'student-list' %}">
    Back to Students
</a>

{% endblock %}
